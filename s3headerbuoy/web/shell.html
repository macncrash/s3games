<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 HEADER BUOY</title>
<style>
  :root { --bg: #071018; --line: #1c3a4a; --ink: #e7f3f6; --dim: #8eacb8; --sun: #f0b429; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  .screen { position: relative; width: min(100%, calc((100vh - 120px) * 4 / 3), 1280px); aspect-ratio: 4 / 3; background: #000;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100% !important; height: 100% !important; outline: none; image-rendering: pixelated; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,.78); cursor: pointer; text-align: center; }
  .overlay b { font-size: 26px; letter-spacing: 6px; color: var(--sun); }
  .overlay span { color: var(--dim); }
  .keys { color: var(--dim); text-align: center; max-width: 960px; }
  kbd { background: #163040; border: 1px solid #2a5166; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }
</style>
</head>
<body>
  <div class="screen">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="overlay" id="overlay">
      <b id="status">LOADING…</b>
      <span id="hint">downloading the cartridge</span>
    </div>
  </div>
  <div class="keys">Arrows steer. <kbd>Z</kbd> tacks. Take the header, round the buoys, and beat the other crew back to the dock.</div>
  <script>
    var statusEl = document.getElementById("status");
    var hintEl = document.getElementById("hint");
    var canvas = document.getElementById("canvas");
    var Module = {
      canvas: canvas,
      onRuntimeInitialized: function () {
        document.getElementById("overlay").remove();
        canvas.focus();
      },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); statusEl.textContent = "FAILED"; hintEl.textContent = t; }
    };
    window.onerror = function (m) { statusEl.textContent = "FAILED"; hintEl.textContent = m; };
  </script>
  <script src="index.js"></script>
</body>
</html>
