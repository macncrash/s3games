<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 TOWER BANN</title>
<style>
  :root { --bg: #100d0c; --line: #3a2a24; --ink: #f2ebe4; --dim: #b5a69c; --sun: #e23b2f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  .screen { position: relative; width: min(100%, calc((100vh - 120px) * 4 / 3), 1280px); aspect-ratio: 4 / 3; background: #000;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100% !important; height: 100% !important; outline: none; image-rendering: pixelated; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,.78); cursor: pointer; text-align: center; }
  .overlay b { font-size: 26px; letter-spacing: 6px; color: var(--sun); }
  .overlay span { color: var(--dim); }
</style>
</head>
<body>
  <div class="screen">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="overlay" id="overlay">
      <b id="status">LOADING…</b>
      <span id="hint">downloading the cartridge</span>
    </div>
  </div>
  <p class="keys">One tower. Bring the banner back.</p>
  <script>
    var status = document.getElementById('status'), hint = document.getElementById('hint'), overlay = document.getElementById('overlay');
    window.Module = {
      canvas: document.getElementById('canvas'),
      print: function () {}, printErr: function () {},
      onRuntimeInitialized: function () { overlay.style.display = 'none'; },
      onAbort: function () { status.textContent = 'FAILED'; hint.textContent = 'the cartridge did not boot'; }
    };
    overlay.addEventListener('click', function () { overlay.style.display = 'none'; document.getElementById('canvas').focus(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
