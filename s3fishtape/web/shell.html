<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 FISHTAPE</title>
<style>
  :root { --bg: #0c1418; --line: #24343c; --ink: #e7f2f4; --dim: #9bb0b6; --sun: #e07a3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  .screen { position: relative; width: min(100%, calc((100vh - 120px) * 4 / 3), 1280px); aspect-ratio: 4 / 3; background: #000;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100% !important; height: 100% !important; outline: none; image-rendering: pixelated; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,.78); cursor: pointer; text-align: center; }
  .overlay b { font-size: 26px; letter-spacing: 6px; color: var(--sun); }
  .overlay span { color: var(--dim); }
  .keys { color: var(--dim); text-align: center; max-width: 960px; }
  kbd { background: #1c2a30; border: 1px solid #345058; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }
</style>
</head>
<body>
  <div class="screen">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="overlay" id="overlay">
      <b id="status">LOADING…</b>
      <span id="hint">downloading the cartridge</span>
    </div>
  </div>
  <div class="keys">
    <kbd>Enter</kbd> start
    <kbd>←</kbd><kbd>→</kbd> fish
    <kbd>Z</kbd> cast on the sweet mark
    <kbd>Esc</kbd> back
  </div>
  <script>
    var statusEl = document.getElementById('status');
    var hintEl = document.getElementById('hint');
    var overlay = document.getElementById('overlay');
    var canvas = document.getElementById('canvas');
    function hideOverlay() { overlay.style.display = 'none'; canvas.focus(); }
    overlay.addEventListener('click', hideOverlay);
    var Module = {
      canvas: canvas,
      onRuntimeInitialized: function () {
        statusEl.textContent = 'S3 FISHTAPE';
        hintEl.textContent = 'click to play';
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
