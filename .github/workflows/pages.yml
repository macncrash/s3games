name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# A pack takes a while. A later cartridge commit must not kill it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: macncrash/s3rally
          path: vendor/s3rally
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Pack every cartridge into one web file
        env:
          S3_ENGINE: ${{ github.workspace }}/vendor/s3rally/src
        run: ./tools/make-web-asset.sh --all
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: pack
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
